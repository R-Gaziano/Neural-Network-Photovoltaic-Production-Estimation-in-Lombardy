[project]
name = "weather"
version = "0.1.0"
description = ""
authors = [
    {name = "gazza.desktop", email = "robertogaetanogaziano@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "geopandas (>=1.1.4,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "sodapy (>=2.2.0,<3.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "pykrige (>=1.7.3,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pmdarima (>=2.1.1,<3.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
